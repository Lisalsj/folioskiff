name: Windows packaged distributions

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Verify exact successful main CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI for this exact main commit
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headSha = $env:GITHUB_SHA
          if ($headSha -cnotmatch '^[0-9a-f]{40}$') { throw "Invalid release commit identity." }
          if ($env:GITHUB_REPOSITORY -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw "Invalid repository identity." }
          if ($env:GITHUB_API_URL -cne "https://api.github.com") { throw "Unexpected GitHub API origin." }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) { throw "GitHub token unavailable." }
          $uri = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&status=success&head_sha=$headSha&exclude_pull_requests=true&per_page=100"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $($env:GITHUB_TOKEN)"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $matches = @($response.workflow_runs | Where-Object {
            $_.head_sha -ceq $headSha -and
            $_.head_branch -ceq "main" -and
            $_.event -ceq "workflow_dispatch" -and
            $_.status -ceq "completed" -and
            $_.conclusion -ceq "success" -and
            $_.path -ceq ".github/workflows/ci.yml"
          })
          if ($matches.Count -lt 1) { throw "Manually run CI on main for this exact commit and wait for it to succeed before packaging." }
          $verified = $matches | Sort-Object id -Descending | Select-Object -First 1
          Write-Output "Verified CI run $($verified.id) for exact main commit $headSha."

  windows-package:
    name: Build and verify Windows distributions
    needs: quality
    uses: ./.github/workflows/_windows-package.yml
    with:
      database_revision: 0038_remove_legacy_conversations
    permissions:
      contents: read

  draft_release:
    name: Publish GitHub Release
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release bytes
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs['windows-package'].outputs.artifact_name }}
          path: ${{ runner.temp }}/verification-bundle
          digest-mismatch: error
      - name: Attest verified release bytes
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/verification-bundle/release/*
      - name: Verify the draft assets and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $env:RUNNER_TEMP "verification-bundle\release"
          $manifest = Get-Content -Raw -Encoding utf8 (Join-Path $release "release-manifest.json") | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$($manifest.version)" -or $manifest.git_commit -cne $env:GITHUB_SHA) { throw "Release identity mismatch." }
          $tagCommit = gh api "repos/$env:GH_REPO/commits/$tag" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) { throw "Tag moved since verification." }

          $files = @(Get-ChildItem -LiteralPath $release -File)
          $expected = @{}
          foreach ($file in $files) {
            $expected[$file.Name] = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          }
          $notes = Join-Path $release "RELEASE_NOTES.md"
          $title = "页舟 · FolioSkiff $($manifest.version)"

          function Read-Release {
            $result = gh release view $tag --json apiUrl,isDraft --repo $env:GH_REPO 2>$null
            if ($LASTEXITCODE -eq 0) { return ($result | ConvertFrom-Json) }
          }
          function Read-AssetDigests($apiUrl) {
            $remote = gh api "$apiUrl/assets?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "Release asset inventory failed." }
            $digests = @{}
            foreach ($asset in ($remote | ConvertFrom-Json)) {
              if ($asset.name -cnotin $expected.Keys -or $digests.ContainsKey($asset.name)) {
                throw "Unexpected or duplicate release asset."
              }
              $digests[$asset.name] = $asset.digest
            }
            return $digests
          }

          $current = Read-Release
          if ($null -eq $current) {
            gh release create $tag --repo $env:GH_REPO --verify-tag --draft --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Draft creation failed." }
            $current = Read-Release
            if ($null -eq $current -or !$current.isDraft) { throw "New draft not found." }
          }
          $digests = Read-AssetDigests $current.apiUrl
          foreach ($file in $files) {
            if ($digests[$file.Name] -ceq $expected[$file.Name]) { continue }
            if (!$current.isDraft) { throw "Published release asset mismatch." }
            gh release upload $tag $file.FullName --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw "Draft asset upload failed." }
          }
          $verified = Read-AssetDigests $current.apiUrl
          foreach ($name in $expected.Keys) {
            if ($verified[$name] -cne $expected[$name]) { throw "Release asset digest mismatch." }
          }
          if ($current.isDraft) {
            gh release edit $tag --repo $env:GH_REPO --draft=false --latest --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Draft publication failed." }
          }
          $published = Read-Release
          if ($null -eq $published -or $published.isDraft) { throw "Release was not published." }
