name: Bug report
description: Report a reproducible paper-reader defect without sharing private research data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Remove credentials, private papers, prompts, backups, and personal reading history before submitting.
  - type: input
    id: app-version
    attributes:
      label: paper-reader version
      placeholder: "3.2.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options: ["Installer", "Portable ZIP", "Source checkout"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostic output
      description: Paste only the minimum relevant, redacted lines.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private paper content, full prompts, local paths, backups, and personal reading data.
          required: true
