[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reader"
version = "3.2.0"
description = "Local-first research agent, paper recommendation, reading, and analysis workspace."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Lisalsj" }]
keywords = ["academic-papers", "research-agent", "paper-recommendation", "pdf-reader"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.19.0,<2",
  "cryptography>=50,<51",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "jsonschema>=4.26.0,<5",
  "keyring>=25.7.0,<26",
  "openpyxl>=3.1.5,<4",
  "platformdirs>=4.11.0,<5",
  "pydantic>=2.13.4,<3",
  "PyMuPDF>=1.28.2,<2",
  "python-multipart>=0.0.32,<1",
  "sqlalchemy>=2.0.51,<3",
  "tzlocal>=5.4.4,<6",
  "tzdata>=2026.3,<2027",
  "uvicorn[standard]>=0.52.1,<1"
]

[project.urls]
Homepage = "https://github.com/Lisalsj/folioskiff"
Repository = "https://github.com/Lisalsj/folioskiff"
Issues = "https://github.com/Lisalsj/folioskiff/issues"
Documentation = "https://github.com/Lisalsj/folioskiff/tree/main/docs"
Changelog = "https://github.com/Lisalsj/folioskiff/blob/main/CHANGELOG.md"

[project.scripts]
paper-reader = "paper_reader.cli:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4,<2",
  "cyclonedx-bom>=7.3.1,<8",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.10.1,<3",
  "pillow>=13,<14",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16.1,<1",
  "types-defusedxml>=0.7.0.20260504,<1",
  "types-jsonschema>=4.26.0.20260518,<5"
]
models = [
  "fastembed>=0.9.1,<0.10",
  "sqlite-vec>=0.1.9,<0.2"
]
ocr = [
  "onnxruntime>=1.28.0,<2",
  "rapidocr>=3.9.2,<4"
]
packaging = [
  "cyclonedx-bom>=7.3.1,<8",
  "pillow>=13,<14",
  "pyinstaller>=6.21.0,<7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_reader = [
  "py.typed",
  "static/**/*",
  "migrations/*.mako",
  "data/*.json",
  "data/*.md",
  "data/*.txt",
  "publishing/assets/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --import-mode=importlib"
timeout = 300
timeout_method = "thread"
filterwarnings = ["error::ResourceWarning"]
markers = [
  "models: requires the optional local embedding/vector runtime",
  "frozen: requires a prebuilt Windows onedir distribution",
  "resource_serial: resource-intensive or subprocess timing-sensitive tests that must run without concurrent pytest workers"
]

[tool.coverage.run]
branch = true
source = ["paper_reader"]
omit = [
  "*/migrations/env.py",
  "*/migrations/versions/*"
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paper_reader"]

[tool.uv]
required-version = ">=0.10.10,<0.12"
