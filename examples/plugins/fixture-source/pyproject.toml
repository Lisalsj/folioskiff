[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reader-fixture-source"
version = "1.0.0"
description = "Offline contract fixture for the paper-reader SourceConnector plugin SDK."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["paper-reader>=0.6,<2"]

[project.entry-points."paper_reader.plugins"]
"fixture.source" = "paper_reader_fixture_source:plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_reader_fixture_source = ["papers.json"]

[tool.uv.sources]
paper-reader = { path = "../../..", editable = true }
